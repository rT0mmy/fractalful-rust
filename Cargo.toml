[package]
name = "fractalful"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
glam = { version = "0.34.1", features = ["serde"] }
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr", "exr"] }
pollster = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "wav", "pcm"] }
winit = "0.30"

# Documents folder lookup and console attach (already in the tree via winit).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Keep deps optimized even in debug builds so dev iterations stay interactive.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
